<svg xmlns="http://www.w3.org/2000/svg">
<!-- Cable cat, mascot v1 (spec §10.4, chosen at the M2 gate). Hand-drawn wobble via #mc-rough to match the sketch diagrams; colours are theme tokens inherited through <use>. The eye circles read three inherited custom properties (blink, eye-x, eye-y; see the style attributes), so CSS on the outer svg can blink them and a Tier B script can point them (spec §9.2 M-10). Never write two hyphens in a row inside an XML comment: it makes the whole sprite invalid. -->
